name: Refresh puzzle indexer

on:
  schedule:
    # Backfill any events the webhook may have missed, once a day at a
    # low-traffic offset (:04)
    - cron: "4 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  indexer:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /indexer/run
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.CACHE_REFRESH_TOKEN }}" \
            "${{ vars.APP_BASE_URL }}/indexer/run" -vvvv