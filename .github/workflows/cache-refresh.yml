name: Refresh puzzle cache

on:
  schedule:
    # Refresh every 6 hours at a low-traffic offset (:17)
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /cache/refresh
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.CACHE_REFRESH_TOKEN }}" \
            "${{ vars.APP_BASE_URL }}/cache/refresh"
